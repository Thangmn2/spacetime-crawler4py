<!DOCTYPE html>
<html>
<head>
    <title>Search Engine</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result { margin: 10px 0; font-size: 1.3em }
        .score { color: rgb(239, 1, 1); font-size: 1em; }
        a { text-decoration: none; color: blue; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<h2>Search Engine :)</h2>

<form method="POST">
    <input type="text" name="query" value="{{ query }}" size="50" placeholder="Enter your search query">
    <button type="submit">Search</button>
</form>

{% if results %}
    <h3>Results:</h3>
    {% for url, score in results[:10] %}
        <div class="result">
            <strong>{{ loop.index }}.</strong>
            <a href="{{ url }}" target="_blank">{{ url }}</a>
            <div class="score">score = {{ "%.4f"|format(score) }}</div>
        </div>
    {% endfor %}
{% else %}
    {% if query %}
        <p>No results found for "<strong>{{ query }}</strong>".</p>
    {% endif %}
{% endif %} 

</body>
</html>
